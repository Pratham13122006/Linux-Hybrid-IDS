<!DOCTYPE html>
<html>
<head>
    <title>Hybrid IDS Dashboard</title>

    <!-- Auto refresh every 3 seconds -->
    <meta http-equiv="refresh" content="3">

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 90%;
            background: #1e293b;
        }

        th, td {
            padding: 10px;
            border: 1px solid #334155;
        }

        th {
            background: #2563eb;
        }

        tr:nth-child(even) {
            background: #1e293b;
        }

        tr:nth-child(odd) {
            background: #0f172a;
        }

        .high {
            color: #ef4444;
            font-weight: bold;
        }

        .medium {
            color: #facc15;
        }

        .low {
            color: #22c55e;
        }
    </style>
</head>
<a href="/logout">
    <button style="
        padding:10px;
        margin:10px;
        background:red;
        color:white;
        border:none;
        cursor:pointer;
    ">
        Logout
    </button>
</a>
<body>

<h1>🚨 Hybrid Intrusion Detection System</h1>

<table>
    <tr>
        <th>Time</th>
        <th>Type</th>
        <th>IP</th>
        <th>Severity</th>
        <th>Message</th>
    </tr>

    {% for alert in alerts %}
    <tr>
        <td>{{ alert.time }}</td>
        <td>{{ alert.type }}</td>
        <td>{{ alert.ip }}</td>

        <td class="{{ alert.severity|lower }}">
            {{ alert.severity }}
        </td>

        <td>{{ alert.message }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
